aid: daylight
name: Daylight
description: >-
  Daylight (Daylight Security) is an AI-native Managed Detection and Response
  (MDR) provider delivering what it calls Managed Agentic Security Services
  (MASS) — combining agentic AI with elite human analysts to run security
  operations end-to-end, from real-time threat detection through Tier 1 triage,
  deep Tier 3 investigations, and full incident response, 24x7x365. The platform
  ingests signals across endpoints, cloud, and networks, learns each customer's
  business context (identity platforms, HR systems, even Slack), and connects
  into the customer stack (AWS, Google Cloud, Microsoft 365, Snowflake, Slack,
  Microsoft Teams). Daylight exposes a partner API at api.daylight.ai (OAuth2 /
  OIDC, Bearer) plus an OAuth-protected Model Context Protocol (MCP) server so
  security teams can connect investigations to AI assistants such as Claude and
  Cursor. Daylight is SOC 2 Type II certified and ISO 27001 compliant. Founded
  in 2024 by Hagai Shapira and Eldad Rudich; backed by Craft Ventures, Bain
  Capital Ventures, and Maple VC ($40M raised). Added to the API Evangelist
  network from VC-portfolio discovery.
